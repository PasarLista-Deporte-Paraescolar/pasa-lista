<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pasa lista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#F4F5F8; --surface:#FFFFFF; --sunken:#ECEEF4;
  --ink:#161B2E; --muted:#5B6177; --line:#DADEE8;
  --board:#1D2340; --board-2:#2B3259; --board-ink:#F4F5F8; --board-muted:#B3B9D6;
  --accent:#3B5BDB; --accent-ink:#FFFFFF; --accent-soft:#E5EAFF;
  --ok:#177A4B; --ok-soft:#DFF2E8; --on-ok:#FFFFFF;
  --no:#BF3A2C; --no-soft:#FBE5E2; --on-no:#FFFFFF;
  --late:#A65705; --late-soft:#FCEAD4; --on-late:#FFFFFF;
  --t-ok:#7FE0AF; --t-no:#FF9E94; --t-late:#FFC680;
  --focus:#3B5BDB;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1120; --surface:#171B2F; --sunken:#1F2440;
    --ink:#E9EBF3; --muted:#A3A9C2; --line:#2D3354;
    --board:#080A15; --board-2:#1A1F3A; --board-ink:#E9EBF3; --board-muted:#9AA1C2;
    --accent:#90A4FF; --accent-ink:#0E1120; --accent-soft:#232B55;
    --ok:#4CC58A; --ok-soft:#12301F; --on-ok:#0E1120;
    --no:#FF7C70; --no-soft:#3B1714; --on-no:#0E1120;
    --late:#FFAA52; --late-soft:#3A2610; --on-late:#0E1120;
    --focus:#90A4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1120; --surface:#171B2F; --sunken:#1F2440;
  --ink:#E9EBF3; --muted:#A3A9C2; --line:#2D3354;
  --board:#080A15; --board-2:#1A1F3A; --board-ink:#E9EBF3; --board-muted:#9AA1C2;
  --accent:#90A4FF; --accent-ink:#0E1120; --accent-soft:#232B55;
  --ok:#4CC58A; --ok-soft:#12301F; --on-ok:#0E1120;
  --no:#FF7C70; --no-soft:#3B1714; --on-no:#0E1120;
  --late:#FFAA52; --late-soft:#3A2610; --on-late:#0E1120;
  --focus:#90A4FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font:700 30px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.015em}
h3{font:700 21px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
p{margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.9em;background:var(--sunken);padding:1px 5px;border-radius:4px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:18px;padding-block:20px 40px}
.note{font-size:14px;color:var(--muted)}
.small{font-size:13px}

/* Cabecera */
.top{position:relative;z-index:10;background:var(--board);color:var(--board-ink)}
.topin{display:flex;flex-direction:column;gap:10px;padding-block:10px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:8px;background:var(--board-2);display:grid;place-items:center}
.logo svg{width:22px;height:22px}
.brand .name{font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.brand .org{font-size:12.5px;color:var(--board-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--board-2);border-radius:10px;padding:4px}
.modes button{font:600 14px var(--f-body);color:var(--board-muted);background:none;border:0;border-radius:7px;min-height:36px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--board-ink);color:var(--board)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px/1.1 var(--f-body);min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--no);border-color:var(--no)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.linkbtn{background:none;border:0;padding:6px 0;font:600 15px var(--f-body);color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--no)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
input,textarea,select{font:16px/1.4 var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.err{background:var(--no-soft);color:var(--no);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700}
.warn{background:var(--late-soft);color:var(--late);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700}
.callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 var(--f-body);padding:5px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.no{background:var(--no-soft);color:var(--no)}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.demo{background:var(--late-soft);color:var(--late);text-transform:uppercase;letter-spacing:.06em}
.chip.sec{background:var(--accent-soft);color:var(--accent)}
.board .chip.sec{background:var(--board-2);color:var(--board-ink)}

/* Tarjetas de lista (móvil) */
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);font:inherit;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card-a{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 24px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.card-g{color:var(--muted);font-size:15px}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* Marcador de la sesión */
.board{background:var(--board);color:var(--board-ink);padding-block:4px 0}
.back{background:none;border:0;color:var(--board-muted);font:600 15px var(--f-body);padding:6px 0;cursor:pointer}
.board-title{font:700 38px/1 var(--f-display);text-transform:uppercase;letter-spacing:.015em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.board-sub{color:var(--board-muted);font-size:15px;margin-top:4px}
.dateline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.dateline label{font-size:13px;color:var(--board-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.dateline input{width:auto;background:var(--board-2);color:var(--board-ink);border-color:var(--board-2);padding:6px 10px;color-scheme:dark}
.dateline .when{font-weight:700}
.tally{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--board-2)}
.tally div{display:flex;flex-direction:column;align-items:center;padding-block:10px 12px}
.tally div + div{border-left:1px solid var(--board-2)}
.tally b{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tally span{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--board-muted);font-weight:700;margin-top:3px}
.tally .sub{font-size:12px;font-weight:700;color:var(--t-late);margin-top:1px}
.tally .n-ok{color:var(--t-ok)} .tally .n-no{color:var(--t-no)} .tally .n-late{color:var(--t-late)}

/* Lista de alumnos */
.rollbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:14px 10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:14px;height:14px}
.roll{list-style:none;margin:0;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:flex;align-items:center;gap:10px;padding-block:9px}
.row + .row{border-top:1px solid var(--line)}
.who{flex:1;min-width:0;background:none;border:0;padding:4px 0;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.who .nm{display:block;font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.who .st{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.row[data-s="A"] .st{color:var(--ok)} .row[data-s="F"] .st{color:var(--no)} .row[data-s="T"] .st{color:var(--late)}
.marks{display:flex;gap:6px;flex:none}
.mk{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.mk svg{width:22px;height:22px}
.mk.A[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.mk.F[aria-pressed="true"]{background:var(--no);border-color:var(--no);color:var(--on-no)}
.mk.T[aria-pressed="true"]{background:var(--late);border-color:var(--late);color:var(--on-late)}
.below{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-block:14px 8px}
@media (max-width: 360px){
  .roll{padding:0 8px}
  .marks{gap:4px}
  .mk{width:40px;height:40px}
  .who .nm{font-size:16.5px;overflow-wrap:break-word}
}

/* Barra inferior y envío */
.dock{position:sticky;bottom:0;z-index:5;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--ground) 72%,transparent)}
.dock.open{position:static;background:none}
.sendpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 24px rgba(10,14,30,.12)}
.preview{margin:0;font:14px/1.45 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunken);border-radius:8px;padding:12px;max-height:15em;overflow:auto}
.preview .code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Coordinación */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-block:14px 0;scrollbar-width:none}
.subtabs button{flex:none;font:700 15px var(--f-body);color:var(--muted);background:none;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:p}
.plist li{display:grid;grid-template-columns:2em 1fr;align-items:center;gap:4px 8px;counter-increment:p}
.plist li::before{content:counter(p);font:600 15px var(--f-display);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.plist .src{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bars li{display:grid;grid-template-columns:minmax(0,9em) 1fr 2.2em;align-items:center;gap:10px;font-size:14px}
.bars .bar{height:10px;border-radius:5px;background:var(--no);min-width:4px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bars.pct .bar{background:var(--ok)}
.bars.pct .bar.low{background:var(--no)}
.bars.pct li{grid-template-columns:minmax(0,9em) 1fr 3.2em}
.dest{background:var(--ok-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px}
.dest b{color:var(--ok)}
.secs{display:flex;flex-direction:column;gap:10px}
.secrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.secrow .field label{font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
td.low{color:var(--no);font-weight:700}
.keypanel{border:2px solid var(--accent)}
.keyform{display:flex;flex-direction:column;gap:12px}
.keyin{font:700 24px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;max-width:11em}
.keybox{margin:0;font:700 34px/1.1 var(--f-mono);letter-spacing:.14em}

/* Normas */
.rules{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
.rules li{padding-left:4px}
.rules b{display:block}
.prose{display:flex;flex-direction:column;gap:10px;max-width:65ch}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap topin">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5"/><path d="M8.5 12.5l2.2 2.2 4.8-4.8"/></svg></span>
      <div style="min-width:0"><div class="name">Pasa lista</div><div class="org" id="org-line">Deporte y paraescolares</div></div>
    </div>
    <nav class="modes" aria-label="Apartados">
      <button type="button" data-act="mode" data-m="monitor" id="m-monitor">Pasar lista</button>
      <button type="button" data-act="mode" data-m="coord" id="m-coord">Coordinación</button>
      <button type="button" data-act="mode" data-m="normas" id="m-normas">Normas</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIM = { names: 80, label: 40, text: 60 };
const DAYS_KEPT = 30;

const mem = {};
const store = {
  get(k, d){
    try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {}
    return k in mem ? mem[k] : d;
  },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

function clean(s, max){
  return String(s == null ? '' : s).replace(/[\x00-\x1f\x7f<>]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
}
// En el resumen, los nombres van separados por comas y la sección por «·»: no pueden llevarlos dentro.
const cleanLabel = s => clean(String(s == null ? '' : s).replace(/[,;]/g, ' '), LIM.label);
const cleanSec = s => clean(String(s == null ? '' : s).replace(/[·#]/g, ' '), 30);
const cleanTeam = s => clean(String(s == null ? '' : s).replace(/#/g, ' '), LIM.text);
function rid(){ return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function countBy(arr){ const c = {}; arr.forEach(x => { c[x] = (c[x] || 0) + 1; }); return c; }

function b64bytes(bytes){
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64bytes(str){
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
const b64e = obj => b64bytes(new TextEncoder().encode(JSON.stringify(obj)));
const b64d = str => JSON.parse(new TextDecoder().decode(unb64bytes(str)));

/* ---------- Clave de las listas ---------- */
// La lista viaja cifrada (AES-GCM con una clave derivada por PBKDF2). Sin la clave, un enlace reenviado no abre nada.
const KEY_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const KEY_LEN = 6, KDF_ROUNDS = 250000;
const normKey = s => String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, '');
const showKey = k => k.slice(0, 3) + '-' + k.slice(3);
const canSeal = () => !!(window.crypto && crypto.subtle);
function newKey(){ return Array.from(crypto.getRandomValues(new Uint8Array(KEY_LEN)), b => KEY_CHARS[b % KEY_CHARS.length]).join(''); }
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normKey(pin)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: KDF_ROUNDS, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(obj, pin){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pin, salt), data));
  const all = new Uint8Array(28 + ct.length);
  all.set(salt); all.set(iv, 16); all.set(ct, 28);
  return b64bytes(all);
}
async function unseal(str, pin){
  const all = unb64bytes(str);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(16, 28) }, await deriveKey(pin, all.slice(0, 16)), all.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}

function phone(p){
  let d = String(p == null ? '' : p).replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 9 && /^[6-9]/.test(d)) d = '34' + d;
  return d.length >= 10 && d.length <= 15 ? d : '';
}
function waLink(num, text){ return 'https://wa.me/' + (num || '') + '?text=' + encodeURIComponent(text); }

/* ---------- Fechas ---------- */
function ymd(dt){ return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
function today(){ return ymd(new Date()); }
function fromYmd(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
const capFirst = s => s.charAt(0).toLocaleUpperCase('es') + s.slice(1);
const fLong = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
const fShort = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
const fTime = new Intl.DateTimeFormat('es-ES', { hour: '2-digit', minute: '2-digit' });
const longDate = d => capFirst(fLong.format(fromYmd(d)));
const shortDate = d => capFirst(fShort.format(fromYmd(d)).replace(/\./g, ''));
const numDate = d => { const p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };

/* ---------- Nombres -> «Nombre + iniciales» ---------- */
const PARTICLES = new Set(['de','del','la','las','los','el','y','e','i','da','das','do','dos','van','von','der','den','di']);
const isParticle = w => PARTICLES.has(w.toLocaleLowerCase('es'));
function titleWord(w){
  const low = w.toLocaleLowerCase('es');
  if (PARTICLES.has(low)) return low;
  return low.replace(/(^|[-'’])(\p{L})/gu, (m, p, c) => p + c.toLocaleUpperCase('es'));
}
const titleName = s => s.split(' ').filter(Boolean).map(titleWord).join(' ').replace(/^\p{Ll}/u, c => c.toLocaleUpperCase('es'));

function groupsFromLeft(words){
  let groups = [], acc = [];
  words.forEach(w => { acc.push(w); if (!isParticle(w)) { groups.push(acc); acc = []; } });
  if (acc.length) { if (groups.length) groups[groups.length - 1] = groups[groups.length - 1].concat(acc); else groups.push(acc); }
  for (let i = groups.length - 1; i > 0 && groups.length > 2; i--) {
    if (isParticle(groups[i][0])) { groups[i - 1] = groups[i - 1].concat(groups[i]); groups.splice(i, 1); }
  }
  if (groups.length > 2) groups = [groups[0], [].concat.apply([], groups.slice(1))];
  return groups;
}
function takeGroupFromRight(words){
  let j = words.length - 1;
  while (j > 0 && isParticle(words[j - 1])) j--;
  return [words.slice(0, j), words.slice(j)];
}
function splitNameFirst(words){
  if (words.length <= 1) return { name: words.join(' '), groups: [], doubt: false };
  let rest = words, groups = [];
  let r = takeGroupFromRight(rest); groups.unshift(r[1]); rest = r[0];
  if (rest.length >= 2) { r = takeGroupFromRight(rest); groups.unshift(r[1]); rest = r[0]; }
  if (!rest.length) { rest = groups.shift(); }
  const doubt = words.length >= 4 && !words.some(isParticle);
  return { name: rest.join(' '), groups, doubt };
}

function parsePerson(line, fmt){
  let raw = line.replace(/\xa0/g, ' ').trim();
  if (!raw) return null;
  const cols = raw.split('\t')
    .map(c => c.trim().replace(/^\d+\s*(?:[.)º\-]\s*|\s+)/, ''))
    .filter(c => c && !/^[\d.\-\/ ]+$/.test(c));
  if (!cols.length) return null;
  const one = cols.join(' ');
  if (/^(n\.?\s*º|nº|número|num\.?|nombres?|alumn[oa]s?|alumnado|apellidos?)(\s|$|:|,|\/)/i.test(one) && one.split(/\s+/).length <= 5) return null;
  let f = fmt;
  if (f === 'auto') {
    if (cols.some(c => c.includes(','))) f = 'comma';
    else if (cols.length >= 3) f = 'c-a1a2n';
    else if (cols.length === 2) f = 'c-apn';
    else f = 'name-first';
  }
  const words = s => s.replace(/,/g, ' ').split(/\s+/).filter(Boolean);
  let name = '', groups = [], doubt = false;
  if (f === 'comma') {
    const s = cols.find(c => c.includes(',')) || one;
    const i = s.indexOf(',');
    groups = groupsFromLeft(words(s.slice(0, i)));
    name = s.slice(i + 1).trim();
  } else if (f === 'name-first') {
    const r = splitNameFirst(words(one)); name = r.name; groups = r.groups; doubt = r.doubt;
  } else if (f === 'c-a1a2n') {
    name = cols[2] || ''; groups = [words(cols[0] || ''), words(cols[1] || '')].filter(g => g.length);
  } else if (f === 'c-na1a2') {
    name = cols[0] || ''; groups = [words(cols[1] || ''), words(cols[2] || '')].filter(g => g.length);
  } else if (f === 'c-apn') {
    name = cols[1] || ''; groups = groupsFromLeft(words(cols[0] || ''));
  } else if (f === 'c-nap') {
    name = cols[0] || ''; groups = groupsFromLeft(words(cols.slice(1).join(' ')));
  }
  name = titleName(clean(name, 40));
  if (!name) return null;
  return { name, groups, doubt, src: clean(one, 80) };
}

function mainWord(g){ return (g.find(w => !isParticle(w)) || g[g.length - 1] || '').replace(/[^\p{L}-]/gu, ''); }
function labelFor(p, k){
  const ini = p.groups.map(g => { const w = mainWord(g); return w ? capFirst(w.slice(0, k).toLocaleLowerCase('es')) + '.' : ''; }).filter(Boolean);
  return cleanLabel([p.name].concat(ini).join(' '));
}
function buildLabels(people){
  let labels = people.map(p => labelFor(p, 1));
  const widened = new Set();
  for (let k = 2; k <= 4; k++) {
    const c = countBy(labels);
    if (!labels.some(l => c[l] > 1)) break;
    labels = labels.map((l, i) => { if (c[l] > 1) { widened.add(i); return labelFor(people[i], k); } return l; });
  }
  const c = countBy(labels), seen = {};
  labels = labels.map((l, i) => { if (c[l] > 1) { widened.add(i); seen[l] = (seen[l] || 0) + 1; return l + ' (' + seen[l] + ')'; } return l; });
  return labels.map((l, i) => ({ label: l, src: people[i].src, doubt: people[i].doubt, widened: widened.has(i) }));
}

/* ---------- Códigos que viajan por WhatsApp ---------- */
// Lista (coordinación → entrenador o monitor): «PL3.<id>.<datos cifrados>». Dentro va
// {v:3, i:id, s:sección, a:equipo, g:horario, m:entrenador, o:club, w:grupo de WhatsApp, t:teléfono, n:[etiquetas]}.
// Se siguen aceptando las listas sin clave de antes: «PL1.» (solo paraescolares) y «PL2.» (el mismo JSON en base64url).
function listPayload(g){
  const dest = secFor(g.s);
  return { v: 3, i: g.id, s: g.s || '', a: g.a, g: g.g, m: g.m, o: cfg.org || '', w: dest.w, t: dest.w ? '' : dest.t, n: g.n };
}
// Cifrar tarda medio segundo y sale distinto cada vez: el resultado se guarda mientras la lista no cambie.
const sealedCache = {};
function listCode(g){
  const p = listPayload(g), sig = JSON.stringify(p) + '|' + g.key;
  const c = sealedCache[g.id];
  if (c && c.sig === sig) return c.code;
  sealedCache[g.id] = { sig, code: null };
  seal(p, g.key).then(s => {
    const now = sealedCache[g.id];
    if (!now || now.sig !== sig) return;
    now.code = 'PL3.' + g.id + '.' + s;
    if (S.mode === 'coord' && S.tab === 'crear' && S.msg === g.id) render();
  }).catch(() => toast('Este navegador no puede cifrar la lista. Abre la app desde su enlace https.'));
  return null;
}
function listFromObj(o){
  if (!o || ![1, 2, 3].includes(o.v) || !Array.isArray(o.n)) return { error: 'Ese código no es de una lista de Pasa lista. Pide a coordinación que te lo reenvíe.' };
  const names = Array.from(new Set(o.n.map(x => cleanLabel(x)).filter(Boolean))).slice(0, LIM.names);
  if (!names.length) return { error: 'La lista llegó sin nombres. Pide a coordinación que la revise.' };
  return { list: {
    id: String(o.i || '').replace(/[^a-z0-9]/gi, '').slice(0, 16) || rid(),
    s: cleanSec(o.s) || (o.v === 1 ? 'Paraescolares' : ''),
    a: cleanTeam(o.a) || 'Actividad', g: clean(o.g, LIM.text), m: clean(o.m, 40),
    o: clean(o.o, LIM.text), w: clean(o.w, LIM.text), t: phone(o.t), n: names, added: Date.now()
  } };
}
const NO_CODE = 'No encuentro ningún código de lista. Copia el mensaje entero que te envió coordinación y vuelve a pegarlo.';
// Devuelve {list}, {error} o {needKey}: una lista con clave que todavía no se ha podido abrir.
async function importList(text, pin){
  const s = String(text || '');
  const m = s.match(/PL3\.([A-Za-z0-9]{4,16})\.([A-Za-z0-9_-]{40,})/);
  if (!m) {
    const old = s.match(/PL([12])\.([A-Za-z0-9_-]{8,})/);
    if (!old) return { error: NO_CODE };
    try { return listFromObj(b64d(old[2])); } catch (e) { return { error: 'El código está cortado o dañado. Pide a coordinación que te lo reenvíe.' }; }
  }
  if (!canSeal()) return { error: 'Este navegador no puede abrir listas con clave. Abre el enlace con Chrome o Safari.' };
  const keys = store.get('pl.keys', {}) || {};
  // Sin clave escrita, se prueban las que ya se usaron en este móvil (primero la de esta lista).
  const tries = pin ? [normKey(pin)] : Array.from(new Set([keys[m[1]]].concat(Object.values(keys)).filter(Boolean))).slice(0, 5);
  for (const k of tries) {
    let o;
    try { o = await unseal(m[2], k); } catch (e) { continue; }
    const r = listFromObj(o);
    if (r.list) { keys[r.list.id] = k; store.set('pl.keys', keys); }
    return r;
  }
  return { needKey: true, error: pin ? 'Esa clave no abre esta lista. Revísala y vuelve a probar.' : '' };
}

// Resumen (entrenador → grupo de asistencia): texto normal, sin códigos. El registro lo vuelve a leer:
//   📋 Sección · Equipo
//   Fecha · Entrenador
//   ✅ Asisten (12 de 15): …      (incluye a los que llegan tarde)
//   ⏱️ Llegan tarde (1): …
//   ❌ Faltan (2): …   o   ❌ Faltan: nadie
//   ❔ Sin marcar (1): …
//   #PL2 2026-09-17 idDeLaLista
const HEAD = '📋';
const RE_FOOT = /#PL2\s+(\d{4}-\d{2}-\d{2})\s+([A-Za-z0-9]{4,16})/;
const FIELDS = [['A', 'Asisten'], ['T', 'Llegan tarde'], ['F', 'Faltan'], ['U', 'Sin marcar']];
function parseReports(text){
  const out = [];
  let cur = null, broken = 0;
  const names = s => /^\s*nadie\b/i.test(s) ? [] : s.split(/\s*,\s*/).map(x => cleanLabel(x)).filter(Boolean).slice(0, LIM.names);
  const close = foot => {
    if (!cur) return;
    const got = FIELDS.some(f => cur[f[0]]);
    if (foot && got) {
      const st = {};
      FIELDS.forEach(f => (cur[f[0]] || []).forEach(n => { st[n] = f[0]; }));
      out.push({ i: foot[2], d: foot[1], s: cur.s, a: cur.a, m: cur.m, total: Math.max(cur.total, Object.keys(st).length), st });
    } else if (got) broken++;
    cur = null;
  };
  // Quita las marcas invisibles que mete WhatsApp al exportar (sobre todo en iPhone).
  String(text || '').replace(/\p{Cf}/gu, '').split(/\r?\n/).forEach(line => {
    const k = line.indexOf(HEAD);
    if (k >= 0) {
      close(null);
      const head = line.slice(k + HEAD.length).trim(), p = head.search(/\s·\s/);
      cur = { s: (p >= 0 ? cleanSec(head.slice(0, p)) : '') || 'Sin sección', a: cleanTeam(p >= 0 ? head.slice(p + 3) : head), m: '', total: 0, dated: false };
      return;
    }
    if (!cur) return;
    const foot = line.match(RE_FOOT);
    if (foot) { close(foot); return; }
    for (const f of FIELDS) {
      const m = line.match(new RegExp(f[1] + '\\s*(?:\\((\\d+)(?:\\s+de\\s+(\\d+))?\\))?\\s*:\\s*(.*)$', 'i'));
      if (m) {
        cur[f[0]] = names(m[3]);
        if (m[2]) cur.total = Math.min(999, parseInt(m[2], 10) || 0);
        return;
      }
    }
    if (!cur.dated && line.trim()) {
      cur.dated = true;
      const p = line.indexOf(' · ');
      if (p >= 0) cur.m = clean(line.slice(p + 3), 40);
    }
  });
  close(null);
  return { found: out, broken };
}

/* ---------- Avisos, copiar y compartir ---------- */
let toastTimer = 0;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
const canShare = typeof navigator.share === 'function';
async function shareText(text){
  try { await navigator.share({ text }); return true; }
  catch (e) {
    if (!e || e.name !== 'AbortError') toast('No se ha podido abrir el menú de compartir. Usa «Copiar».');
    return false;
  }
}
async function copyWithToast(text, okMsg){
  toast(await copyText(text) ? okMsg : 'No se ha podido copiar. Mantén pulsado el texto y cópialo a mano.');
}

function purgeOld(){
  const limit = ymd(new Date(Date.now() - DAYS_KEPT * 864e5));
  let changed = false;
  Object.keys(sessions).forEach(id => {
    if (!lists.some(l => l.id === id)) { delete sessions[id]; changed = true; return; }
    Object.keys(sessions[id]).forEach(d => { if (d < limit) { delete sessions[id][d]; changed = true; } });
    if (!Object.keys(sessions[id]).length) { delete sessions[id]; changed = true; }
  });
  if (changed) store.set('pl.sessions', sessions);
}
const getList = id => lists.find(l => l.id === id);
function sess(id, d){
  const s = sessions[id] && sessions[id][d];
  return s && s.marks ? s : { marks: {}, sent: null };
}
function saveSess(id, d, s){ sessions[id] = sessions[id] || {}; sessions[id][d] = s; store.set('pl.sessions', sessions); }
function counts(l, s){
  const c = { A: 0, F: 0, T: 0, U: 0 };
  l.n.forEach(n => { const v = s.marks[n]; if (v === 'A' || v === 'F' || v === 'T') c[v]++; else c.U++; });
  return c;
}

function summary(l, d, s){
  const by = k => l.n.filter(n => (['A', 'F', 'T'].includes(s.marks[n]) ? s.marks[n] : 'U') === k);
  const T = by('T'), F = by('F'), U = by('U');
  const A = l.n.filter(n => s.marks[n] === 'A' || s.marks[n] === 'T');
  const lines = [
    HEAD + ' ' + (l.s || 'Sin sección') + ' · ' + l.a,
    longDate(d) + (l.m ? ' · ' + l.m : ''),
    '✅ Asisten (' + A.length + ' de ' + l.n.length + '): ' + (A.length ? A.join(', ') : 'nadie')
  ];
  if (T.length) lines.push('⏱️ Llegan tarde (' + T.length + '): ' + T.join(', '));
  lines.push(F.length ? '❌ Faltan (' + F.length + '): ' + F.join(', ') : '❌ Faltan: nadie');
  if (U.length) lines.push('❔ Sin marcar (' + U.length + '): ' + U.join(', '));
  const foot = '#PL2 ' + d + ' ' + l.id;
  return { text: lines.join('\n') + '\n' + foot, lines, foot, U };
}

function statusChip(l){
  const s = sess(l.id, today()), c = counts(l, s), marked = l.n.length - c.U;
  if (s.sent) return '<span class="chip ok">Hoy: enviada a las ' + esc(fTime.format(new Date(s.sent))) + '</span>';
  if (marked) return '<span class="chip late">Hoy: ' + marked + ' de ' + l.n.length + ' marcados, sin enviar</span>';
  return '<span class="chip">Hoy: sin pasar</span>';
}

      <p class="note">Escribe la clave que te ha dado coordinación: ${KEY_LEN} letras y números. Solo hace falta la primera vez.</p>
      <form id="key-form" class="keyform" novalidate autocomplete="off">
        <div class="field"><label for="key-in">Clave</label>
          <input id="key-in" class="keyin" value="${esc(S.keyText)}" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="12" placeholder="ABC-234"></div>

      ${l.g ? `<span class="card-g">${esc(l.g)}</span>` : ''}

const focusKey = () => { const k = $('#key-in'); if (k) { window.scrollTo(0, 0); k.focus(); } };
function clearHash(){
  // Quita la lista de la barra de direcciones: si el entrenador guarda la app, se guarda sin datos.
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
function saveImported(list){
  const i = lists.findIndex(l => l.id === list.id);
  if (i >= 0) lists[i] = list; else lists.push(list);
  store.set('pl.lists', lists);
  Object.assign(S, { mode: 'monitor', addError: '', addText: '', lock: null, keyError: '', keyText: '', opening: false,
    listId: list.id, date: today(), sending: false, confirmRemove: false });
  store.set('pl.mode', 'monitor');
  clearHash();
  render(); window.scrollTo(0, 0);
  toast((i >= 0 ? 'Lista actualizada: ' : 'Lista guardada en este móvil: ') + list.a);
}
async function addList(){
  const text = ($('#code-in') || {}).value || '';
  S.addText = text;
  const r = await importList(text);
  if (r.list) { saveImported(r.list); return; }
  if (r.needKey) { Object.assign(S, { lock: { text }, keyError: '', keyText: '', addError: '' }); render(); focusKey(); return; }
  S.addError = r.error; render();
  const t = $('#code-in'); if (t) t.focus();
}
async function unlock(){
  if (!S.lock || S.busy) return;
  const raw = ($('#key-in') || {}).value || '';
  S.keyText = raw;
  if (normKey(raw).length < KEY_LEN) { S.keyError = 'Escribe la clave entera: son ' + KEY_LEN + ' letras y números.'; render(); focusKey(); return; }
  S.busy = true;
  const btn = $('#key-go');
  if (btn) { btn.disabled = true; btn.textContent = 'Abriendo…'; }
  const r = await importList(S.lock.text, raw);
  S.busy = false;
  if (r.list) { saveImported(r.list); return; }
  S.keyError = r.error || 'Esa clave no abre esta lista.';
  render(); focusKey();
}

    <span class="marks" role="group" aria-label="${esc(name)}">${['A', 'F', 'T'].map(k =>
      `<button type="button" class="mk ${k}" data-act="mark" data-i="${i}" data-k="${k}" aria-pressed="${v === k}" aria-label="${STATE_TXT[k]}" title="${STATE_TXT[k]}">${ICON[k]}</button>`).join('')}</span>

}
function tallyHTML(c){

function markRow(i, k){
  const l = getList(S.listId); if (!l) return;
  const name = l.n[i]; if (name == null) return;
  const s = sess(l.id, S.date), cur = s.marks[name] || '';
  const next = k === 'quick' ? (cur || 'A') : (cur === k ? '' : k);
  if (next === cur) return;
  if (next) s.marks[name] = next; else delete s.marks[name];
  saveSess(l.id, S.date, s);
  const li = app.querySelector('.row[data-i="' + i + '"]');
  if (li) {
    li.dataset.s = next;
    li.querySelector('.st').textContent = STATE_TXT[next];
    li.querySelectorAll('.mk').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === next)));
  }
  const t = $('#tally'); if (t) t.innerHTML = tallyHTML(counts(l, s));
  if (S.sending) { const d = app.querySelector('.dock .wrap'); if (d) d.innerHTML = sendPanel(l, s); }
}
function markSent(close){
  const l = getList(S.listId); if (!l) return;
  const s = sess(l.id, S.date); s.sent = Date.now(); saveSess(l.id, S.date, s);
  if (close) setTimeout(() => { S.sending = false; render(); toast('Sesión marcada como enviada'); }, 400);
}

// Sugerencias para el nombre del equipo: categorías habituales y equipos ya creados en esa sección.

  return names.map(n => `<option value="${esc(n)}"${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
}
function secOrder(n){ const i = cfg.secs.findIndex(x => x.n === n); return i < 0 ? 99 : i; }
const bySecTeam = (x, y) => secOrder(x.s) - secOrder(y.s) || (x.s || '').localeCompare(y.s || '', 'es') || x.a.localeCompare(y.a, 'es', { numeric: true });

      <textarea id="c-names" data-d="raw" rows="7" placeholder="GARCÍA PÉREZ, Lucía&#10;RODRÍGUEZ SANZ, Mateo&#10;DE LA FUENTE LÓPEZ, Noa">${esc(d.raw)}</textarea>

        <li>
          <input id="lbl-${i}" data-lbl="${i}" maxlength="40" value="${esc(p.label)}" aria-label="Nombre ${i + 1}">

            ${p.doubt ? '<span class="chip late">Revisa: ¿nombre compuesto?</span>' : ''}
            ${p.widened ? '<span class="chip">Coincidía con otro: más letras</span>' : ''}
            ${dupes[cleanLabel(p.label)] > 1 ? '<span class="chip no">Repetido</span>' : ''}

    </section>`;
}

function monitorMessage(g){
  const code = listCode(g), dest = secFor(g.s);
  if (!code) return null;
  const lines =[(g.m ? 'Hola, ' + g.m + '.' : 'Hola.') + ' Te paso la lista de ' + g.a + (g.s ? ' (' + g.s + ')' : '') + ' para pasar lista en el móvil.', ''];
  if (cfg.url) {
    // La lista va detrás de «#»: esa parte del enlace no llega al servidor que aloja la app.
    lines.push('Toca este enlace y se abrirá la app con tu lista:', cfg.url + '#' + code, '',
      'Si no se abre, entra en ' + cfg.url + ', toca «Añadir una lista» y pega este mensaje entero.');
  } else {
    lines.push('Abre la app Pasa lista, toca «Añadir una lista» y pega este mensaje entero.', '', code);
  }
  lines.push('', 'La primera vez te pedirá una clave, que te doy aparte.');
  if (dest.w) lines.push('', 'Cuando pases lista, envía el resumen al grupo «' + dest.w + '». Solo a ese grupo.');
  lines.push('', 'Solo lleva nombres e iniciales. Por favor, no reenvíes este mensaje ni la clave, y no hagas capturas.');
  return lines.join('\n');
}
function coordMessage(){
  const g = groups.find(x => x.id === S.msg); if (!g) return '';
  const text = monitorMessage(g), who = g.m || 'el entrenador';
  if (!text) return `<section class="panel" id="msg-panel" aria-labelledby="msg-h"><h3 id="msg-h">Mensaje para ${esc(who)}</h3><p class="note">Cifrando la lista…</p></section>`;
  const shared = groups.filter(x => x.id !== g.id && x.key === g.key).length;
  return `

function syncDraft(){
  const d = S.draft; if (!d) return;
  app.querySelectorAll('[data-d]').forEach(el => { d[el.dataset.d] = el.value; });
  app.querySelectorAll('[data-lbl]').forEach(el => { const p = d.people[+el.dataset.lbl]; if (p) p.label = el.value; });
}
function convertDraft(){
  const d = S.draft;
  const parsed = d.raw.split(/\r?\n/).map(x => parsePerson(x, d.fmt)).filter(Boolean);
  if (!parsed.length) { toast('No encuentro nombres. Pega una persona por línea.'); return; }
  const fresh = buildLabels(parsed);
  const taken = new Set(d.people.map(p => cleanLabel(p.label)));
  fresh.forEach(p => {
    let l = p.label, n = 2;
    while (taken.has(l)) { l = p.label + ' (' + n++ + ')'; p.widened = true; }
    p.label = l; taken.add(l);
  });
  d.people = d.people.concat(fresh);
  if (d.people.length > LIM.names) { d.people = d.people.slice(0, LIM.names); toast('Como mucho ' + LIM.names + ' alumnos por lista'); }
  d.raw = ''; S.msg = null;
  render();
  const h = $('#pv-h'); if (h) h.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function generate(){
  const d = S.draft;
  d.s = cleanSec(d.s); d.a = cleanTeam(d.a); d.g = clean(d.g, LIM.text); d.m = clean(d.m, 40);
  if (!d.s) { toast('Elige la sección (se añaden en Ajustes)'); return; }
  if (!d.a) { toast('Escribe el nombre del equipo o la actividad'); const el = $('#c-a'); if (el) el.focus(); return; }
  const labels = d.people.map(p => cleanLabel(p.label));
  if (labels.some(l => !l)) { toast('Hay un nombre vacío: escríbelo o quítalo'); return; }
  const c = countBy(labels);
  if (labels.some(l => c[l] > 1)) { render(); toast('Hay nombres repetidos: cambia alguno para distinguirlos'); return; }
  // Si cambia el entrenador, cambia la clave: el anterior ya no podrá abrir la lista nueva.
  const prev = groups.find(x => x.id === d.id);
  const sameCoach = prev && clean(prev.m, 40).toLocaleLowerCase('es') === d.m.toLocaleLowerCase('es');
  const key = (sameCoach && prev.key) || coachKey(d.m, d.id) || newKey();
  const g = { id: d.id || rid(), s: d.s, a: d.a, g: d.g, m: d.m, n: labels, key, updated: Date.now() };
  const i = groups.findIndex(x => x.id === g.id);
  if (i >= 0) groups[i] = g; else groups.unshift(g);
  store.set('pl.groups', groups);
  S.lastSec = g.s;
  S.draft = { id: g.id, s: g.s, a: g.a, g: g.g, m: g.m, fmt: d.fmt, raw: '', people: labels.map(l => ({ label: l, src: '' })) };
  S.msg = g.id;
  render();
  const p = $('#msg-panel'); if (p) p.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

const PERIODS = [['all', 'Todo'], ['7', 'Últimos 7 días'], ['30', 'Últimos 30 días'], ['month', 'Este mes'], ['prev', 'Mes pasado']];
const LOW = 75;
// «#» no puede ir en la sección ni en el equipo: sirve de separador.
const teamKey = r => (r.s || '') + '#' + r.a;
function inPeriod(d){
  const p = S.regPeriod, now = new Date();
  if (p === '7' || p === '30') return d >= ymd(new Date(Date.now() - (+p - 1) * 864e5));
  if (p === 'month') return d.slice(0, 7) === today().slice(0, 7);
  if (p === 'prev') return d.slice(0, 7) === ymd(new Date(now.getFullYear(), now.getMonth() - 1, 1)).slice(0, 7);
  return true;
}
function regRows(){
  return register.filter(r => (!S.regSec || (r.s || '') === S.regSec) && (!S.regTeam || teamKey(r) === S.regTeam) && inPeriod(r.d));
}
function namesBy(r){
  const g = { A: [], T: [], F: [], U: [] };
  Object.keys(r.st).forEach(n => { if (g[r.st[n]]) g[r.st[n]].push(n); });
  return g;
}
// Los que vinieron (con los que llegaron tarde). Las sesiones de la primera versión no traían la lista entera.
function came(r){ const g = namesBy(r); return r.old ? Math.max(0, r.total - g.F.length - g.U.length) : g.A.length + g.T.length; }
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const pctCell = p => `<td class="num${p != null && p < LOW ? ' low' : ''}">${p == null ? '—' : p + ' %'}</td>`;

function teamsOverview(rows){
  const m = new Map();
  rows.forEach(r => {
    const k = teamKey(r);
    let t = m.get(k);
    if (!t) { t = { s: r.s, a: r.a, n: 0, came: 0, known: 0, last: '' }; m.set(k, t); }
    const c = came(r);
    t.n++; t.came += c; t.known += c + namesBy(r).F.length;
    if (r.d > t.last) t.last = r.d;
  });
  return Array.from(m.values()).sort(bySecTeam);
}
function playersOf(rows){
  const m = new Map();
  rows.filter(r => !r.old).forEach(r => Object.keys(r.st).forEach(n => {
    let p = m.get(n);
    if (!p) { p = { n, A: 0, T: 0, F: 0, U: 0 }; m.set(n, p); }
    if (p[r.st[n]] != null) p[r.st[n]]++;
  }));
  return Array.from(m.values())
    .map(p => Object.assign(p, { pct: pct(p.A + p.T, p.A + p.T + p.F) }))
    .sort((x, y) => (x.pct == null ? 101 : x.pct) - (y.pct == null ? 101 : y.pct) || x.n.localeCompare(y.n, 'es'));
}

async function readChatFile(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  // iPhone exporta el chat en un .zip con un _chat.txt dentro.
  return buf[0] === 0x50 && buf[1] === 0x4b ? unzipTexts(buf) : new TextDecoder().decode(buf);
}
async function unzipTexts(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip');
  const count = dv.getUint16(eocd + 10, true), dec = new TextDecoder();
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let k = 0; k < count && p + 46 <= buf.length && dv.getUint32(p, true) === 0x02014b50; k++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true), off = dv.getUint32(p + 42, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (!/\.txt$/i.test(name) || dv.getUint32(off, true) !== 0x04034b50) continue;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const data = buf.subarray(start, start + size);
    if (method === 0) out.push(dec.decode(data));
    else if (method === 8) {
      if (typeof DecompressionStream !== 'function') throw new Error('deflate');
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      out.push(await new Response(stream).text());
    }
  }
  if (!out.length) throw new Error('zip');
  return out.join('\n');
}
async function loadChatFile(input){
  const f = input.files && input.files[0];
  if (!f) return;
  try { addReports(await readChatFile(f)); }
  catch (e) {
    toast(e && e.message === 'deflate' ? 'Este navegador no abre .zip: descomprímelo y carga el .txt de dentro.' : 'No he podido leer ese archivo. Carga el .txt o el .zip que da WhatsApp al exportar el chat.');
  }
  input.value = '';
}

function addReports(text){
  const r = parseReports(text);
  const warn = r.broken ? ' · ' + r.broken + ' sin la línea #PL2 (no se pueden leer)' : '';
  if (!r.found.length) {
    toast(r.broken ? 'Hay ' + r.broken + ' resúmenes sin su última línea (#PL2…): no se pueden leer.' : 'No encuentro ningún resumen. Copia los mensajes enteros, con su última línea #PL2.');
    return;
  }
  let added = 0, changed = 0, same = 0;
  r.found.forEach(x => {
    const i = register.findIndex(y => y.i === x.i && y.d === x.d);
    if (i < 0) { register.push(x); added++; }
    else if (JSON.stringify(register[i]) === JSON.stringify(x)) same++;
    else { register[i] = x; changed++; }
  });
  store.set('pl.reg2', register);
  S.regText = '';
  render();
  const parts = [(added === 1 ? '1 sesión nueva' : added + ' sesiones nuevas')];
  if (changed) parts.push(changed + (changed === 1 ? ' corregida' : ' corregidas'));
  if (same) parts.push(same + ' ya estaban');
  toast(parts.join(' · ') + warn);
}

function toTSV(head, rows){

}

    </section>
    <div class="btnrow"><button type="button" class="btn primary" data-act="s-save">Guardar ajustes</button></div>
    <p class="note small">Si cambias un grupo, un número o el nombre del club, reenvía las listas a los entrenadores para que les llegue el cambio.</p>`;
}
function saveSettings(){
  const org = clean(($('#s-org') || {}).value, LIM.text);
  const url = clean(($('#s-url') || {}).value, 300).replace(/[#?].*$/, '');
  if (url && !/^https:\/\/\S+$/i.test(url)) { toast('El enlace tiene que empezar por https://'); return; }
  const secs = [];
  for (const x of S.secDraft || cfg.secs) {
    const n = cleanSec(x.n), w = clean(x.w, LIM.text), raw = String(x.t || '').trim(), t = phone(raw);
    if (!n) { if (w || raw) { toast('Hay una sección sin nombre'); return; } continue; }
    if (raw && !t) { toast('El número de «' + n + '» no parece válido: escribe 9 cifras o ponle el prefijo del país.'); return; }
    if (secs.some(s => s.n === n)) { toast('La sección «' + n + '» está repetida'); return; }
    secs.push({ n, w, t });
  }
  if (!secs.length) { toast('Deja al menos una sección'); return; }
  Object.assign(cfg, { org, url, secs });
  store.set('pl.cfg', cfg);
  S.secDraft = null;
  render();
  toast('Ajustes guardados');
}

function coordClick(act, b){
  const d = S.draft;
  switch (act) {
    case 'tab': S.tab = b.dataset.t; S.confirmClear = false; S.confirmDel = null; S.secDraft = null; render(); window.scrollTo(0, 0); break;
    case 'c-convert': syncDraft(); convertDraft(); break;
    case 'c-reset': S.draft = newDraft(); S.msg = null; render(); break;
    case 'c-drop': syncDraft(); d.people.splice(+b.dataset.i, 1); S.msg = null; render(); break;
    case 'c-generate': syncDraft(); generate(); break;
    case 'c-share': case 'c-copy': {
      const g = groups.find(x => x.id === S.msg), text = g && monitorMessage(g);
      if (!text) { toast('Un momento: se está preparando el mensaje'); break; }
      if (act === 'c-share') shareText(text); else copyWithToast(text, 'Mensaje copiado');
      break;
    }
    case 'k-copy': { const g = groups.find(x => x.id === S.msg); if (g) copyWithToast(showKey(g.key), 'Clave copiada'); break; }
    case 'g-msg': case 'g-edit': {
      const g = groups.find(x => x.id === b.dataset.id); if (!g) break;
      S.draft = { id: g.id, s: g.s, a: g.a, g: g.g, m: g.m, fmt: 'auto', raw: '', people: g.n.map(l => ({ label: l, src: '' })) };
      S.msg = act === 'g-msg' ? g.id : null; S.tab = 'crear';
      render();
      const t = $(act === 'g-msg' ? '#msg-panel' : '#pv-h'); if (t) t.scrollIntoView({ block: 'start' });
      break;
    }
    case 'g-del': S.confirmDel = b.dataset.id; render(); break;
    case 'g-del-no': S.confirmDel = null; render(); break;
    case 'g-del-yes':
      groups = groups.filter(x => x.id !== b.dataset.id); store.set('pl.groups', groups);
      if (d && d.id === b.dataset.id) { S.draft = newDraft(); S.msg = null; }
      S.confirmDel = null; render(); toast('Lista borrada de este ordenador');
      break;
    case 'r-add': addReports(($('#r-in') || {}).value || ''); break;
    case 'r-sample': S.regText = sampleText(); render(); toast('Ejemplo pegado: pulsa «Añadir lo pegado»'); break;
    case 'r-team': {
      const r = register.find(x => teamKey(x) === b.dataset.k);
      if (r) { S.regSec = r.s || ''; S.regTeam = b.dataset.k; }
      render();
      const h = $('#r-team'); if (h) h.scrollIntoView({ block: 'start' });
      break;
    }
    case 'r-copy': copyWithToast(registerTSV(), 'Tabla copiada: pégala en Excel'); break;
    case 'r-copy-p': copyWithToast(playersTSV(), 'Tabla copiada: pégala en Excel'); break;
    case 'r-clear': S.confirmClear = true; render(); break;
    case 'r-clear-no': S.confirmClear = false; render(); break;
    case 'r-clear-yes':
      register = []; store.set('pl.reg2', register); store.del('pl.register');
      Object.assign(S, { confirmClear: false, regSec: '', regTeam: '' }); render(); toast('Registro vaciado');
      break;
    case 'sec-add': S.secDraft.push({ n: '', w: '', t: '' }); render(); { const i = $('#sec-n-' + (S.secDraft.length - 1)); if (i) i.focus(); } break;
    case 'sec-del': S.secDraft.splice(+b.dataset.i, 1); render(); break;
    case 's-save': saveSettings(); break;
  }
}
function coordInput(e){
  const t = e.target;
  if (S.mode !== 'coord') return;
  if (t.id === 'r-in') { S.regText = t.value; return; }
  if (t.dataset.sec != null) { const x = S.secDraft && S.secDraft[+t.dataset.sec]; if (x) x[t.dataset.f] = t.value; return; }
  if (t.id === 's-org' || t.id === 's-url') return;
  if (!S.draft) return;
  if (t.dataset.d) S.draft[t.dataset.d] = t.value;
  else if (t.dataset.lbl != null) { const p = S.draft.people[+t.dataset.lbl]; if (p) p.label = t.value; }
  else return;
  if (S.msg && t.dataset.d !== 'raw') { S.msg = null; const m = $('#msg-panel'); if (m) m.remove(); }
}

/* ---------- Eventos y arranque ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, l = getList(S.listId);
  const go = () => { render(); window.scrollTo(0, 0); };
  switch (act) {
    case 'mode': Object.assign(S, { mode: b.dataset.m, sending: false, confirmRemove: false }); store.set('pl.mode', S.mode); go(); break;
    case 'open': Object.assign(S, { listId: b.dataset.id, date: today(), sending: false, confirmRemove: false }); go(); break;
    case 'home': Object.assign(S, { listId: null, sending: false, confirmRemove: false }); go(); break;
    case 'add': addList(); break;
    case 'mark': markRow(+b.dataset.i, b.dataset.k); break;
    case 'quick': markRow(+b.dataset.i, 'quick'); break;
    case 'all':
      if (!l) break;
      { const s = sess(l.id, S.date); l.n.forEach(n => { if (!s.marks[n]) s.marks[n] = 'A'; }); saveSess(l.id, S.date, s); render(); }
      break;
    case 'clearmarks':
      if (!l) break;
      if (Date.now() - S.armClear < 3000) {
        const s = sess(l.id, S.date); s.marks = {}; saveSess(l.id, S.date, s);
        S.armClear = 0; render(); toast('Marcas borradas');
      } else {
        S.armClear = Date.now(); b.textContent = 'Toca otra vez para borrar';
        setTimeout(() => { if (b.isConnected) b.textContent = 'Borrar marcas'; }, 3000);
      }
      break;
    case 'remove': S.confirmRemove = true; render(); break;
    case 'remove-no': S.confirmRemove = false; render(); break;
    case 'remove-yes':
      if (!l) break;
      lists = lists.filter(x => x.id !== l.id); delete sessions[l.id];
      store.set('pl.lists', lists); store.set('pl.sessions', sessions);
      { const keys = store.get('pl.keys', {}) || {}; if (keys[l.id]) { delete keys[l.id]; store.set('pl.keys', keys); } }
      Object.assign(S, { listId: null, confirmRemove: false }); go(); toast('Lista quitada de este móvil');
      break;
    case 'send':
      S.sending = true; render();
      { const p = $('#sendpanel'); if (p) p.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
      break;
    case 'cancel-send': S.sending = false; render(); break;
    case 'sent': markSent(true); break;
    case 'share-sum': if (l) shareText(summary(l, S.date, sess(l.id, S.date)).text).then(ok => { if (ok) markSent(true); }); break;
    case 'copy-sum':
      if (l) { copyWithToast(summary(l, S.date, sess(l.id, S.date)).text, 'Resumen copiado: pégalo en ' + (l.w ? 'el grupo «' + l.w + '»' : 'el chat de coordinación')); markSent(false); }
      break;
    case 'unlock-cancel': Object.assign(S, { lock: null, keyError: '', keyText: '' }); clearHash(); render(); break;
    default: coordClick(act, b);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'date-in') {
    if (/^\d{4}-\d{2}-\d{2}$/.test(t.value) && t.value <= today()) { S.date = t.value; S.sending = false; render(); }
    else t.value = S.date;
  }
  else if (t.id === 'r-sec') { S.regSec = t.value; S.regTeam = ''; render(); }
  else if (t.id === 'r-team') { S.regTeam = t.value; render(); }
  else if (t.id === 'r-per') { S.regPeriod = t.value; render(); }
  else if (t.id === 'r-file') loadChatFile(t);
  else if (t.dataset && t.dataset.d && S.draft) {
    S.draft[t.dataset.d] = t.value;
    if (t.dataset.d === 's') { syncDraft(); S.lastSec = t.value; render(); }
  }
});
document.addEventListener('input', coordInput);

// La clave va en un formulario: así también la abre la tecla «Ir» del teclado del móvil.
document.addEventListener('submit', e => {
  if (e.target && e.target.id === 'key-form') { e.preventDefault(); unlock(); }
});

// Llega con el enlace de su lista (al abrir la app o con la app ya abierta). Si la lista tiene clave
// y este móvil no la conoce, se la pide; el código se queda en la barra de direcciones hasta que se abra.
function importFromHash(){
  let text = '';
  try { text = /PL[123]\./.test(location.hash) ? decodeURIComponent(location.hash) : ''; } catch (e) {}
  if (!text) return false;
  Object.assign(S, { mode: 'monitor', listId: null, opening: true, lock: null, sending: false, confirmRemove: false });
  render();
  importList(text).then(r => {
    S.opening = false;
    if (r.list) { saveImported(r.list); return; }
    if (r.needKey) Object.assign(S, { lock: { text }, keyError: '', keyText: '' });
    else { S.addError = r.error; clearHash(); }
    render(); focusKey();
  });
  return true;
}
window.addEventListener('hashchange', importFromHash);

purgeOld();
if (!importFromHash()) render();
})();
</script>
</body>
